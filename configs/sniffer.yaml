# Band n3 sni5gect config from configs/sni5gect/srsgnb_band3.yaml.
cell:
  band: 3
  nof_prb: 106
  scs_common: 15
  scs_ssb: 15
  ssb_period_ms: 1
  dl_arfcn: 368500
  ssb_arfcn: 368410

source:
  source_type: uhd
  source_params: type=b200,master_clock_rate=23.04e6,clock=external

enable_recorder: false
pcap_folder: logs/

rf:
  sample_rate: 23.04e6
  num_channels: 1
  uplink_cfo: 0
  downlink_cfo: 0
  padding:
    front_padding: 0
    back_padding: 0
  channels:
    - rx_frequency: 1842.5e6
      tx_frequency: 1842.5e6
      rx_offset: 0
      tx_offset: 3000
      rx_gain: 40
      tx_gain: 50
      enable: true
    - rx_frequency: 1747.5e6
      tx_frequency: 1747.5e6
      rx_offset: 0
      tx_offset: 0
      rx_gain: 40
      tx_gain: 50
      enable: false

workers:
  pool_size: 24
  n_ue_dl_worker: 4
  n_ue_ul_worker: 4
  n_gnb_dl_worker: 4
  n_gnb_ul_worker: 4

uetracker:
  close_timeout: 5000
  parse_messages: true
  num_ues: 1
  enable_gpu: false

downlink_injector:
  delay_n_slots: 5
  duplications: 2
  tx_cfo_correction: 0
  tx_advancement: 160
  pdsch_mcs: 3
  pdsch_prbs: 24

databases:
  - enable: true
    host: "influxdb"
    port: 8086
    org: "rtu"
    token: "605bc59413b7d5457d181ccf20f9fda15693f81b068d70396cc183081b264f3b"
    bucket: "rtusystem"
    data_id: "test"

log:
  log_level: INFO
  syncer: INFO
  worker: INFO
  bc_worker: INFO

exploit: build/modules/lib_dummy_exploit.so
